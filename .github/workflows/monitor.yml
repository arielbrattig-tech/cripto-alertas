name: Monitor cripto

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:         # permite rodar manualmente pela aba Actions
    inputs:
      teste:
        description: "Enviar mensagem de teste no WhatsApp"
        type: boolean
        default: false

permissions:
  contents: write            # para salvar o state.json

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar preços
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TESTE: ${{ inputs.teste }}
        run: python monitor.py

      - name: Salvar estado
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Atualiza estado dos alertas"
            git push
          fi
